# Cloud Run ortam değişkenleri ŞABLONU.
# Kopyalayın: .cloudrun.env.yaml (gitignore'da) ve gerçek değerleri yalnızca orada tutun.
# Tercihen MESA_ADMIN_PASSWORD ve MESA_MFA_TOTP_SECRET için Secret Manager kullanın:
#   gcloud run deploy ... --set-secrets MESA_ADMIN_PASSWORD=mesa-admin-password:latest
NODE_ENV: "production"
API_PORT: "8080"
# Tam origin olmalı, "*" üretimde reddedilir
CORS_ORIGIN: "https://www.mesaismakineleri.com.tr"
# Cloud Run'da /tmp geçicidir; kalıcı veri için Firestore/Cloud SQL'e taşıyın
MESA_DB_FILE: "/tmp/mesa-data.json"
MESA_ADMIN_EMAIL: "yonetici@ornek-alan-adi.com"
# En az 12 karakter, benzersiz ve başka hiçbir yerde kullanılmayan bir parola
MESA_ADMIN_PASSWORD: "DEGISTIRIN"
# Base32 TOTP anahtarı (Google Authenticator / Authy). Üretmek için:
#   node -e "const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';console.log(Array.from(require('crypto').randomBytes(20),b=>a[b%32]).join(''))"
MESA_MFA_TOTP_SECRET: "DEGISTIRIN"
# Cloud Run gibi güvenilir bir proxy arkasında X-Forwarded-For başlığını kullan
TRUST_PROXY: "true"
